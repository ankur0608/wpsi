<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B24"/>
      <stop offset="100%" stop-color="#2A174E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#8B5CF6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#C084FC" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#E879F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.25" stroke="#C084FC" stroke-width="1.5"/>
    <text x="325" y="24" fill="#E879F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">ELECTRONICS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Number Systems, Logic Gates,</tspan><tspan x="70" y="298">and Boolean Algebra</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#E879F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- Logic Gates & Truth Table -->
          <!-- NAND Gate -->
          <path d="M 60,60 L 120,60 A 40,40 0 0 1 120,140 L 60,140 Z" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="3"/>
          <circle cx="165" cy="100" r="7" fill="none" stroke="#8B5CF6" stroke-width="3"/>
          <line x1="20" y1="80" x2="60" y2="80" stroke="#C084FC" stroke-width="3"/>
          <line x1="20" y1="120" x2="60" y2="120" stroke="#C084FC" stroke-width="3"/>
          <line x1="172" y1="100" x2="210" y2="100" stroke="#C084FC" stroke-width="3"/>
          <text x="35" y="75" fill="#E879F9" font-family="monospace" font-size="12">A</text>
          <text x="35" y="115" fill="#E879F9" font-family="monospace" font-size="12">B</text>
          <text x="110" y="105" fill="#FFFFFF" font-family="system-ui" font-size="14" font-weight="bold">NAND</text>
          <text x="215" y="105" fill="#E879F9" font-family="monospace" font-size="14">Y=(A·B)'</text>

          <!-- Truth Table Card -->
          <rect x="60" y="160" width="260" height="110" rx="10" fill="#1E293B" stroke="#C084FC" stroke-width="2"/>
          <text x="190" y="185" fill="#C084FC" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Universal Logic Matrix</text>
          <line x1="60" y1="195" x2="320" y2="195" stroke="#334155" stroke-width="1"/>
          <g fill="#FFFFFF" font-family="monospace" font-size="12">
            <text x="90" y="215">A=0, B=0 → Y=1</text>
            <text x="90" y="235">A=0, B=1 → Y=1</text>
            <text x="90" y="255">A=1, B=1 → Y=0</text>
          </g>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>