<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B24"/>
      <stop offset="100%" stop-color="#2A174E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#8B5CF6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#C084FC" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#E879F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.25" stroke="#C084FC" stroke-width="1.5"/>
    <text x="325" y="24" fill="#E879F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">ELECTRONICS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Understanding</tspan><tspan x="70" y="298">Microprocessors vs</tspan><tspan x="70" y="346">Microcontrollers</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#E879F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- 8085 vs 8051 Chip -->
          <rect x="40" y="40" width="130" height="230" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="3"/>
          <text x="105" y="155" fill="#E879F9" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">8085</text>
          <text x="105" y="180" fill="#94A3B8" font-family="system-ui" font-size="12" text-anchor="middle">MPU (CPU only)</text>
          <!-- Pins left -->
          <rect x="20" y="60" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="85" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="110" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="135" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="160" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="185" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="210" width="20" height="8" rx="2" fill="#C084FC"/><rect x="20" y="235" width="20" height="8" rx="2" fill="#C084FC"/>
          <!-- Pins right -->
          <rect x="170" y="60" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="85" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="110" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="135" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="160" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="185" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="210" width="20" height="8" rx="2" fill="#C084FC"/><rect x="170" y="235" width="20" height="8" rx="2" fill="#C084FC"/>

          <!-- 8051 SoC -->
          <rect x="220" y="40" width="140" height="230" rx="12" fill="#1E293B" stroke="#C084FC" stroke-width="3"/>
          <text x="290" y="120" fill="#C084FC" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">8051</text>
          <rect x="235" y="140" width="110" height="25" rx="4" fill="#8B5CF6" fill-opacity="0.3"/>
          <text x="290" y="157" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">RAM 128B + ROM</text>
          <rect x="235" y="175" width="110" height="25" rx="4" fill="#8B5CF6" fill-opacity="0.3"/>
          <text x="290" y="192" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">Timers + I/O</text>
          <text x="290" y="235" fill="#E879F9" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">SoC / Microcontroller</text>
          <rect x="360" y="60" width="16" height="8" rx="2" fill="#E879F9"/><rect x="360" y="95" width="16" height="8" rx="2" fill="#E879F9"/><rect x="360" y="130" width="16" height="8" rx="2" fill="#E879F9"/><rect x="360" y="165" width="16" height="8" rx="2" fill="#E879F9"/><rect x="360" y="200" width="16" height="8" rx="2" fill="#E879F9"/><rect x="360" y="235" width="16" height="8" rx="2" fill="#E879F9"/>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>