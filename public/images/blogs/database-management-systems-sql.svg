<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Database Management Systems</tspan>
    <tspan x="70" y="302">&amp; SQL Fundamentals</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- Relational DBMS & SQL -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <!-- SQL Terminal / Query Box -->
    <rect x="40" y="35" width="340" height="95" rx="8" fill="#1E293B" stroke="#60A5FA"/>
    <rect x="40" y="35" width="340" height="24" rx="8" fill="#0F172A"/>
    <circle cx="55" cy="47" r="4" fill="#EF4444"/>
    <circle cx="70" cy="47" r="4" fill="#F59E0B"/>
    <circle cx="85" cy="47" r="4" fill="#10B981"/>
    <text x="110" y="51" fill="#94A3B8" font-family="monospace" font-size="10">query.sql</text>
    <g fill="#93C5FD" font-family="monospace" font-size="11">
      <text x="55" y="78"><tspan fill="#F472B6">SELECT</tspan> rank, name, score</text>
      <text x="55" y="98"><tspan fill="#F472B6">FROM</tspan> candidates <tspan fill="#F472B6">WHERE</tspan> exam = <tspan fill="#FDE047">'WPSI'</tspan></text>
      <text x="55" y="118"><tspan fill="#F472B6">ORDER BY</tspan> score <tspan fill="#38BDF8">DESC</tspan> <tspan fill="#F472B6">LIMIT</tspan> 10;</text>
    </g>
    <!-- Table Schema Visualization -->
    <g transform="translate(40, 140)">
      <rect x="0" y="0" width="340" height="130" rx="8" fill="#1E293B" stroke="#334155"/>
      <rect x="0" y="0" width="340" height="28" rx="8" fill="#3B82F6" fill-opacity="0.3"/>
      <text x="15" y="19" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold">id (PK)</text>
      <text x="95" y="19" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold">roll_no</text>
      <text x="180" y="19" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold">score</text>
      <text x="260" y="19" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold">status</text>
      <line x1="0" y1="28" x2="340" y2="28" stroke="#334155"/>
      <!-- Row 1 -->
      <text x="15" y="48" fill="#FFFFFF" font-family="monospace" font-size="11">101</text>
      <text x="95" y="48" fill="#E2E8F0" font-family="monospace" font-size="11">WPSI-2026</text>
      <text x="180" y="48" fill="#10B981" font-family="monospace" font-size="11">182.5</text>
      <text x="260" y="48" fill="#38BDF8" font-family="system-ui" font-size="10" font-weight="bold">PASSED</text>
      <!-- Row 2 -->
      <line x1="0" y1="58" x2="340" y2="58" stroke="#334155"/>
      <text x="15" y="78" fill="#FFFFFF" font-family="monospace" font-size="11">102</text>
      <text x="95" y="78" fill="#E2E8F0" font-family="monospace" font-size="11">GPSC-9844</text>
      <text x="180" y="78" fill="#10B981" font-family="monospace" font-size="11">178.0</text>
      <text x="260" y="78" fill="#38BDF8" font-family="system-ui" font-size="10" font-weight="bold">PASSED</text>
      <!-- Bottom Badge -->
      <rect x="10" y="94" width="320" height="24" rx="4" fill="#0F172A" stroke="#3B82F6"/>
      <text x="170" y="110" fill="#60A5FA" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">ACID Properties • 1NF, 2NF, 3NF Normalization</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>