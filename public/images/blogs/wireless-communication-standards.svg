<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05151E"/>
      <stop offset="100%" stop-color="#0C3246"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#22D3EE" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#67E8F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="335" y="24" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TELECOMMUNICATION</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Wireless Communication</tspan>
    <tspan x="70" y="302">Standards: Wi-Fi &amp; Bluetooth</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#67E8F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- Wi-Fi and Bluetooth Standards -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#05151E" stroke="#06B6D4" stroke-width="2"/>
    <text x="210" y="50" fill="#67E8F9" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">IEEE 802.11 &amp; Bluetooth SIG</text>
    <!-- Wi-Fi Card -->
    <g transform="translate(40, 65)">
      <rect x="0" y="0" width="165" height="135" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <!-- Wi-Fi Waves -->
      <path d="M 50,45 A 40,40 0 0 1 115,45" fill="none" stroke="#22D3EE" stroke-width="3"/>
      <path d="M 60,55 A 25,25 0 0 1 105,55" fill="none" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="82" cy="70" r="5" fill="#67E8F9"/>
      <text x="82" y="95" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Wi-Fi (802.11)</text>
      <text x="82" y="112" fill="#67E8F9" font-family="system-ui" font-size="10" text-anchor="middle">2.4 GHz, 5 GHz, 6 GHz</text>
      <text x="82" y="125" fill="#94A3B8" font-family="system-ui" font-size="9" text-anchor="middle">802.11ax (Wi-Fi 6)</text>
    </g>
    <!-- Bluetooth Card -->
    <g transform="translate(215, 65)">
      <rect x="0" y="0" width="165" height="135" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
      <!-- Bluetooth Rune -->
      <g transform="translate(82, 50)">
        <path d="M -10,-20 L 10,0 L -10,20 L -10,-20 L 0,-10 L 0,10 L -10,20" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="82" y="95" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">Bluetooth (WPAN)</text>
      <text x="82" y="112" fill="#93C5FD" font-family="system-ui" font-size="10" text-anchor="middle">2.4 GHz ISM Band</text>
      <text x="82" y="125" fill="#94A3B8" font-family="system-ui" font-size="9" text-anchor="middle">BLE 5.3 • Frequency Hopping</text>
    </g>
    <!-- Comparison Bar -->
    <rect x="40" y="215" width="340" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="210" y="234" fill="#E2E8F0" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">WLAN (High Throughput) vs. WPAN (Low Energy / BLE)</text>
    <text x="210" y="249" fill="#67E8F9" font-family="system-ui" font-size="9" text-anchor="middle">Modulation: OFDM / DSSS vs. GFSK / FHSS</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>