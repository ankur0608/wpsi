<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05151E"/>
      <stop offset="100%" stop-color="#0C3246"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#22D3EE" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#67E8F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="325" y="24" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TELECOMMUNICATION</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Understanding Antenna Theory</tspan><tspan x="70" y="298">and Types</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#67E8F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(750, 150)">
          <!-- Dipole Antenna with Radiation Pattern -->
          <!-- Radiation Lobes -->
          <ellipse cx="200" cy="150" rx="120" ry="60" fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="2" stroke-dasharray="6,4"/>
          <ellipse cx="200" cy="150" rx="80" ry="40" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="2"/>
          <ellipse cx="200" cy="150" rx="40" ry="20" fill="#67E8F9" fill-opacity="0.3" stroke="#67E8F9" stroke-width="2"/>
          <!-- Center Dipole Mast -->
          <line x1="200" y1="50" x2="200" y2="140" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
          <line x1="200" y1="160" x2="200" y2="250" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
          <circle cx="200" cy="150" r="7" fill="#67E8F9"/>
          <text x="200" y="35" fill="#67E8F9" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">λ/2 Dipole Antenna</text>
          <!-- Waves Radiating -->
          <path d="M 270,110 A 60,60 0 0 1 270,190" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
          <path d="M 300,90 A 90,90 0 0 1 300,210" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <path d="M 130,110 A 60,60 0 0 0 130,190" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
          <path d="M 100,90 A 90,90 0 0 0 100,210" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>