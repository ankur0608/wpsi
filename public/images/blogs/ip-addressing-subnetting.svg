<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081325"/>
      <stop offset="100%" stop-color="#0C2E4E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#0284C7" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#38BDF8" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#7DD3FC"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="325" y="24" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER NETWORKS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Mastering IP Addressing and</tspan><tspan x="70" y="298">Subnetting</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#7DD3FC"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(730, 160)">
          <!-- Subnet Calculator / CIDR -->
          <rect x="20" y="30" width="350" height="250" rx="16" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2"/>
          <text x="195" y="70" fill="#7DD3FC" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">192.168.1.0 /24</text>
          <g fill="#38BDF8" font-family="monospace" font-size="14" opacity="0.9">
            <text x="50" y="120">Subnet: 255.255.255.0</text>
            <text x="50" y="150">Block Size: 2^(32 - n)</text>
            <text x="50" y="180">Usable Hosts: 2^h - 2</text>
            <text x="50" y="210">Network ID: .0</text>
            <text x="50" y="240">Broadcast ID: .255</text>
          </g>
          <rect x="260" y="140" width="90" height="90" rx="12" fill="#38BDF8" fill-opacity="0.2" stroke="#7DD3FC" stroke-width="2"/>
          <text x="305" y="185" fill="#FFFFFF" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">CIDR</text>
          <text x="305" y="205" fill="#7DD3FC" font-family="system-ui" font-size="12" text-anchor="middle">IPv4 Math</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>