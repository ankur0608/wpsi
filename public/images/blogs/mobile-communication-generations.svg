<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05151E"/>
      <stop offset="100%" stop-color="#0C3246"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#22D3EE" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#67E8F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="325" y="24" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TELECOMMUNICATION</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Generations of Mobile</tspan><tspan x="70" y="298">Communication: 1G to 5G</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#67E8F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- Earth & Satellite Orbit -->
          <circle cx="200" cy="200" r="80" fill="#1E3A8A" stroke="#22D3EE" stroke-width="3"/>
          <path d="M 160,170 Q 180,160 210,180 Q 230,220 200,240 Q 170,220 160,170 Z" fill="#10B981" opacity="0.6"/>
          <!-- Satellite in Orbit -->
          <ellipse cx="200" cy="200" rx="150" ry="80" fill="none" stroke="#67E8F9" stroke-width="2" stroke-dasharray="8,5" opacity="0.5"/>
          <g transform="translate(290, 130) rotate(-25)">
            <rect x="-15" y="-12" width="30" height="24" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
            <!-- Solar panels -->
            <rect x="-45" y="-8" width="25" height="16" fill="#0284C7" stroke="#38BDF8"/>
            <rect x="20" y="-8" width="25" height="16" fill="#0284C7" stroke="#38BDF8"/>
          </g>
          <!-- Radio Beam down to Earth -->
          <line x1="290" y1="140" x2="220" y2="180" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3,3"/>
          <circle cx="220" cy="180" r="5" fill="#EF4444"/>
          <text x="200" y="310" fill="#67E8F9" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Trilateration & Orbit Geostationary</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>