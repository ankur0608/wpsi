<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05151E"/>
      <stop offset="100%" stop-color="#0C3246"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#22D3EE" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#67E8F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="335" y="24" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TELECOMMUNICATION</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Generations of Mobile</tspan>
    <tspan x="70" y="302">Communication: 1G to 5G</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#67E8F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- Cellular Evolution 1G to 5G -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#05151E" stroke="#06B6D4" stroke-width="2"/>
    <text x="210" y="50" fill="#67E8F9" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Evolution of Cellular Standards</text>
    <!-- Tower and waves -->
    <g transform="translate(45, 75)">
      <!-- 5G Tower Mast -->
      <polygon points="35,130 45,130 41,20 39,20" fill="#67E8F9"/>
      <line x1="30" y1="40" x2="50" y2="40" stroke="#67E8F9" stroke-width="2"/>
      <line x1="26" y1="65" x2="54" y2="65" stroke="#67E8F9" stroke-width="2"/>
      <line x1="22" y1="95" x2="58" y2="95" stroke="#67E8F9" stroke-width="2"/>
      <line x1="30" y1="40" x2="54" y2="65" stroke="#67E8F9" stroke-width="1.5"/>
      <line x1="50" y1="40" x2="26" y2="65" stroke="#67E8F9" stroke-width="1.5"/>
      <!-- Radiating signals -->
      <circle cx="40" cy="20" r="5" fill="#EF4444"/>
      <path d="M 52,10 A 18,18 0 0 1 52,30" fill="none" stroke="#22D3EE" stroke-width="2"/>
      <path d="M 60,3 A 28,28 0 0 1 60,37" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="3,2"/>
    </g>
    <!-- Generation Timeline Cards -->
    <g transform="translate(130, 70)">
      <!-- 1G & 2G -->
      <rect x="0" y="0" width="115" height="42" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="12" y="18" fill="#94A3B8" font-family="system-ui" font-size="10" font-weight="bold">1G (AMPS)</text>
      <text x="12" y="33" fill="#64748B" font-family="system-ui" font-size="9">Analog Voice • 2.4K</text>
      <rect x="125" y="0" width="130" height="42" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="137" y="18" fill="#94A3B8" font-family="system-ui" font-size="10" font-weight="bold">2G (GSM/CDMA)</text>
      <text x="137" y="33" fill="#64748B" font-family="system-ui" font-size="9">Digital SMS • 64 Kbps</text>
      <!-- 3G & 4G -->
      <rect x="0" y="50" width="115" height="42" rx="6" fill="#0F172A" stroke="#0284C7"/>
      <text x="12" y="68" fill="#38BDF8" font-family="system-ui" font-size="10" font-weight="bold">3G (UMTS/HSPA)</text>
      <text x="12" y="83" fill="#94A3B8" font-family="system-ui" font-size="9">Mobile Web • 2 Mbps</text>
      <rect x="125" y="50" width="130" height="42" rx="6" fill="#0F172A" stroke="#0284C7"/>
      <text x="137" y="68" fill="#38BDF8" font-family="system-ui" font-size="10" font-weight="bold">4G (LTE-A)</text>
      <text x="137" y="83" fill="#94A3B8" font-family="system-ui" font-size="9">All-IP VoLTE • 100 Mbps</text>
      <!-- 5G Flagship -->
      <rect x="0" y="100" width="255" height="46" rx="8" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="2"/>
      <text x="15" y="122" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold">5G New Radio (NR)</text>
      <text x="15" y="138" fill="#67E8F9" font-family="system-ui" font-size="10">eMBB • URLLC • mMTC (20 Gbps Speed)</text>
    </g>
    <!-- Footer info -->
    <rect x="40" y="240" width="345" height="28" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-opacity="0.5"/>
    <text x="212" y="259" fill="#67E8F9" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Multiple Access: FDMA → TDMA → CDMA → OFDMA</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>