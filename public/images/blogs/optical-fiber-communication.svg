<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05151E"/>
      <stop offset="100%" stop-color="#0C3246"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#06B6D4" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#22D3EE" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#67E8F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#06B6D4" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="325" y="24" fill="#67E8F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TELECOMMUNICATION</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Introduction to Optical</tspan><tspan x="70" y="298">Fiber Communication</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#67E8F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(730, 160)">
          <!-- Total Internal Reflection in Fiber Core -->
          <rect x="20" y="60" width="350" height="160" rx="16" fill="#0E2338" stroke="#06B6D4" stroke-width="2"/>
          <rect x="20" y="90" width="350" height="100" fill="#0284C7" fill-opacity="0.2"/>
          <text x="40" y="80" fill="#64748B" font-family="system-ui" font-size="12">Cladding (n2)</text>
          <text x="40" y="145" fill="#67E8F9" font-family="system-ui" font-size="16" font-weight="bold">Core (n1 > n2)</text>
          <text x="40" y="210" fill="#64748B" font-family="system-ui" font-size="12">Cladding (n2)</text>
          <!-- Light Ray -->
          <path d="M 20,140 L 90,90 L 170,190 L 250,90 L 330,190 L 370,140" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
          <circle cx="90" cy="90" r="6" fill="#FDE047"/>
          <circle cx="170" cy="190" r="6" fill="#FDE047"/>
          <circle cx="250" cy="90" r="6" fill="#FDE047"/>
          <circle cx="330" cy="190" r="6" fill="#FDE047"/>
          <rect x="100" y="235" width="200" height="30" rx="6" fill="#06B6D4" fill-opacity="0.3"/>
          <text x="200" y="255" fill="#FFFFFF" font-family="monospace" font-size="12" text-anchor="middle">Critical Angle: θc = sin⁻¹(n2/n1)</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>