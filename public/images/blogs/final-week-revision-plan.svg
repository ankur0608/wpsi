<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0909"/>
      <stop offset="100%" stop-color="#451313"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#EF4444" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#F87171" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#FCA5A5"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#EF4444" fill-opacity="0.25" stroke="#F87171" stroke-width="1.5"/>
    <text x="325" y="24" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">EXAM STRATEGY</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">The Final 7 Days: Ultimate</tspan><tspan x="70" y="298">Revision Plan</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#FCA5A5"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- Topper Trophy / 90 Days Growth Graph -->
          <rect x="30" y="30" width="320" height="230" rx="16" fill="#EF4444" fill-opacity="0.15" stroke="#F87171" stroke-width="2"/>
          <!-- Trend Graph line -->
          <polyline points="60,200 120,170 180,180 240,110 300,70" fill="none" stroke="#F87171" stroke-width="4"/>
          <circle cx="60" cy="200" r="6" fill="#EF4444"/>
          <text x="60" y="225" fill="#EF4444" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">45 M</text>
          <circle cx="300" cy="70" r="8" fill="#FCA5A5"/>
          <text x="300" y="55" fill="#FCA5A5" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Rank #12 (85+)</text>
          <!-- Trophy Icon -->
          <path d="M 160,110 L 200,110 L 200,140 Q 200,160 180,165 Q 160,160 160,140 Z" fill="#FCA5A5" opacity="0.8"/>
          <rect x="175" y="165" width="10" height="15" fill="#FCA5A5"/>
          <rect x="165" y="180" width="30" height="8" rx="2" fill="#FCA5A5"/>
          <text x="190" y="245" fill="#FFFFFF" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">90-Day Strategy Blueprint</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>