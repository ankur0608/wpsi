<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A"/>
      <stop offset="100%" stop-color="#0F2744"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007FFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#007FFF" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#007FFF" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#00F0FF" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#007FFF" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#38BDF8"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#007FFF" fill-opacity="0.25" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="325" y="24" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TECHNICAL PAPER</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Top 50 Most Repeated</tspan><tspan x="70" y="298">Questions in Computer</tspan><tspan x="70" y="346">Networks</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#38BDF8"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <!-- Network Nodes and Mesh -->
        <g transform="translate(750, 150)">
          <circle cx="200" cy="160" r="130" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
          <line x1="200" y1="60" x2="100" y2="180" stroke="#007FFF" stroke-width="3" opacity="0.7"/>
          <line x1="200" y1="60" x2="300" y2="180" stroke="#007FFF" stroke-width="3" opacity="0.7"/>
          <line x1="100" y1="180" x2="140" y2="280" stroke="#007FFF" stroke-width="3" opacity="0.7"/>
          <line x1="300" y1="180" x2="260" y2="280" stroke="#007FFF" stroke-width="3" opacity="0.7"/>
          <line x1="140" y1="280" x2="260" y2="280" stroke="#007FFF" stroke-width="3" opacity="0.7"/>
          <line x1="200" y1="60" x2="200" y2="160" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
          <line x1="100" y1="180" x2="200" y2="160" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
          <line x1="300" y1="180" x2="200" y2="160" stroke="#38BDF8" stroke-width="2" opacity="0.8"/>
          <!-- Central Switch -->
          <rect x="165" y="130" width="70" height="60" rx="12" fill="#007FFF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="185" cy="160" r="4" fill="#38BDF8"/>
          <circle cx="200" cy="160" r="4" fill="#38BDF8"/>
          <circle cx="215" cy="160" r="4" fill="#38BDF8"/>
          <!-- Outer Nodes -->
          <circle cx="200" cy="60" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="200" cy="60" r="8" fill="#38BDF8"/>
          <circle cx="100" cy="180" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="100" cy="180" r="8" fill="#38BDF8"/>
          <circle cx="300" cy="180" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="300" cy="180" r="8" fill="#38BDF8"/>
          <circle cx="140" cy="280" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="140" cy="280" r="8" fill="#38BDF8"/>
          <circle cx="260" cy="280" r="24" fill="#00F0FF" fill-opacity="0.2" stroke="#00F0FF" stroke-width="3"/>
          <circle cx="260" cy="280" r="8" fill="#38BDF8"/>
          <!-- Packets -->
          <circle cx="150" cy="120" r="5" fill="#FFFFFF"/>
          <circle cx="250" cy="120" r="5" fill="#FFFFFF"/>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>