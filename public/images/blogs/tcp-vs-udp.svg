<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081325"/>
      <stop offset="100%" stop-color="#0C2E4E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#0284C7" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#38BDF8" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#7DD3FC"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="325" y="24" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER NETWORKS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Transport Layer Protocols:</tspan><tspan x="70" y="298">TCP vs. UDP</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#7DD3FC"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- TCP 3-Way Handshake -->
          <rect x="20" y="40" width="160" height="240" rx="16" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="2"/>
          <text x="100" y="75" fill="#7DD3FC" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">TCP (Reliable)</text>
          <line x1="50" y1="110" x2="150" y2="130" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,2"/>
          <polygon points="150,130 142,125 142,135" fill="#38BDF8"/>
          <text x="100" y="105" fill="#FFFFFF" font-family="system-ui" font-size="11" text-anchor="middle">SYN</text>
          <line x1="150" y1="160" x2="50" y2="180" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,2"/>
          <polygon points="50,180 58,175 58,185" fill="#38BDF8"/>
          <text x="100" y="155" fill="#FFFFFF" font-family="system-ui" font-size="11" text-anchor="middle">SYN-ACK</text>
          <line x1="50" y1="210" x2="150" y2="230" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4,2"/>
          <polygon points="150,230 142,225 142,235" fill="#38BDF8"/>
          <text x="100" y="205" fill="#FFFFFF" font-family="system-ui" font-size="11" text-anchor="middle">ACK</text>
          
          <!-- UDP Stream -->
          <rect x="210" y="40" width="160" height="240" rx="16" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="2"/>
          <text x="290" y="75" fill="#FCA5A5" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">UDP (Fast/Stream)</text>
          <circle cx="250" cy="120" r="10" fill="#EF4444"/>
          <circle cx="280" cy="140" r="10" fill="#EF4444"/>
          <circle cx="310" cy="120" r="10" fill="#EF4444"/>
          <circle cx="270" cy="190" r="10" fill="#EF4444"/>
          <circle cx="300" cy="220" r="10" fill="#EF4444"/>
          <text x="290" y="255" fill="#FFFFFF" font-family="system-ui" font-size="12" text-anchor="middle">Zero Handshake</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>