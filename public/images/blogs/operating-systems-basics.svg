<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Operating Systems: Functions</tspan>
    <tspan x="70" y="302">&amp; Memory Management</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- OS Architecture & Memory Management -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="210" y="52" fill="#93C5FD" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Operating System Architecture</text>
    <!-- User Space -->
    <rect x="40" y="65" width="340" height="44" rx="8" fill="#1E293B" stroke="#60A5FA"/>
    <text x="210" y="92" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">User Space (Applications, GUI, CLI)</text>
    <!-- System Call Interface -->
    <rect x="40" y="117" width="340" height="26" rx="4" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA"/>
    <text x="210" y="134" fill="#93C5FD" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">System Calls (fork, exec, read, write)</text>
    <!-- Kernel Space -->
    <rect x="40" y="150" width="340" height="78" rx="8" fill="#1E293B" stroke="#10B981"/>
    <g transform="translate(50, 160)">
      <rect x="0" y="0" width="95" height="58" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="47" y="26" fill="#10B981" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Process</text>
      <text x="47" y="42" fill="#94A3B8" font-family="system-ui" font-size="9" text-anchor="middle">Scheduler</text>
      <rect x="110" y="0" width="100" height="58" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="160" y="26" fill="#10B981" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Virtual Memory</text>
      <text x="160" y="42" fill="#94A3B8" font-family="system-ui" font-size="9" text-anchor="middle">Paging &amp; MMU</text>
      <rect x="225" y="0" width="95" height="58" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="272" y="26" fill="#10B981" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">File System</text>
      <text x="272" y="42" fill="#94A3B8" font-family="system-ui" font-size="9" text-anchor="middle">I/O Drivers</text>
    </g>
    <!-- Hardware Layer -->
    <rect x="40" y="235" width="340" height="36" rx="6" fill="#0F172A" stroke="#64748B"/>
    <text x="210" y="258" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Hardware (CPU • RAM • Disks • Network NIC)</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>