<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">C Programming: Pointers,</tspan>
    <tspan x="70" y="302">Arrays, and Functions</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- IDE Window -->
    <rect x="20" y="30" width="380" height="260" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <rect x="20" y="30" width="380" height="35" rx="14" fill="#1E293B"/>
    <circle cx="45" cy="48" r="5" fill="#EF4444"/>
    <circle cx="65" cy="48" r="5" fill="#F59E0B"/>
    <circle cx="85" cy="48" r="5" fill="#10B981"/>
    <text x="210" y="52" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">pointers_arrays.c - C Programming</text>
    <g fill="#93C5FD" font-family="monospace" font-size="12">
      <text x="40" y="92"><tspan fill="#F472B6">#include</tspan> &lt;stdio.h&gt;</text>
      <text x="40" y="116"><tspan fill="#38BDF8">int</tspan> arr[5] = {10, 20, 30, 40, 50};</text>
      <text x="40" y="140"><tspan fill="#38BDF8">int</tspan> *ptr = arr; <tspan fill="#64748B">// &amp;arr[0]</tspan></text>
      <text x="40" y="164">printf(<tspan fill="#FDE047">&quot;Val: %d, Addr: %p&quot;</tspan>, *ptr, ptr);</text>
      <text x="40" y="188">ptr++; <tspan fill="#64748B">// pointer arithmetic</tspan></text>
    </g>
    <!-- Memory address blocks -->
    <g transform="translate(40, 210)">
      <rect x="0" y="0" width="70" height="44" rx="6" fill="#1E293B" stroke="#60A5FA"/>
      <text x="35" y="20" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">10</text>
      <text x="35" y="36" fill="#93C5FD" font-family="monospace" font-size="9" text-anchor="middle">0x1000</text>
      <rect x="75" y="0" width="70" height="44" rx="6" fill="#1E293B" stroke="#60A5FA"/>
      <text x="110" y="20" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">20</text>
      <text x="110" y="36" fill="#93C5FD" font-family="monospace" font-size="9" text-anchor="middle">0x1004</text>
      <rect x="150" y="0" width="70" height="44" rx="6" fill="#1E293B" stroke="#60A5FA"/>
      <text x="185" y="20" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">30</text>
      <text x="185" y="36" fill="#93C5FD" font-family="monospace" font-size="9" text-anchor="middle">0x1008</text>
      <rect x="230" y="0" width="100" height="44" rx="6" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA"/>
      <text x="280" y="26" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Pointers &amp; Memory</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>