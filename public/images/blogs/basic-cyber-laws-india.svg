<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14"/>
      <stop offset="100%" stop-color="#0D382B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#10B981" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#34D399" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#6EE7B7"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="1.5"/>
    <text x="325" y="24" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">TECHNOLOGY</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Basic Cyber Laws in India</tspan><tspan x="70" y="298">(IT Act 2000)</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#6EE7B7"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(750, 150)">
          <!-- Cyber Shield & Lock -->
          <path d="M 200,40 L 300,80 L 300,180 Q 300,260 200,290 Q 100,260 100,180 L 100,80 Z" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-width="4"/>
          <!-- Padlock -->
          <rect x="170" y="160" width="60" height="50" rx="8" fill="#6EE7B7"/>
          <path d="M 180,160 L 180,135 A 20,20 0 0 1 220,135 L 220,160" fill="none" stroke="#6EE7B7" stroke-width="6" stroke-linecap="round"/>
          <circle cx="200" cy="180" r="5" fill="#0F172A"/>
          <line x1="200" y1="185" x2="200" y2="195" stroke="#0F172A" stroke-width="3"/>
          <text x="200" y="240" fill="#FFFFFF" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">IT ACT 2000 • SEC 66</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>