<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0818"/>
      <stop offset="100%" stop-color="#451234"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#EC4899" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#F472B6" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#FB7185"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#EC4899" fill-opacity="0.25" stroke="#F472B6" stroke-width="1.5"/>
    <text x="325" y="24" fill="#FB7185" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">PHYSICS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Fundamentals of</tspan><tspan x="70" y="298">Electromagnetic Waves for</tspan><tspan x="70" y="346">Competitive Exams</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#FB7185"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(730, 160)">
          <!-- 3D EM Wave Propagation: E-Field & B-Field -->
          <line x1="20" y1="150" x2="380" y2="150" stroke="#94A3B8" stroke-width="2"/>
          <polygon points="380,150 370,145 370,155" fill="#94A3B8"/>
          <text x="360" y="180" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="bold">z (c)</text>
          <!-- E Field (Vertical Sine) -->
          <path d="M 40,150 Q 100,50 160,150 Q 220,250 280,150 Q 340,50 380,120" fill="none" stroke="#EC4899" stroke-width="4"/>
          <text x="100" y="45" fill="#EC4899" font-family="system-ui" font-size="16" font-weight="bold">Electric Field (E)</text>
          <!-- B Field (Horizontal/Oblique Sine) -->
          <path d="M 40,150 Q 100,190 160,150 Q 220,110 280,150 Q 340,190 380,160" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="6,3"/>
          <text x="220" y="280" fill="#F472B6" font-family="system-ui" font-size="16" font-weight="bold">Magnetic Field (B)</text>
          <circle cx="160" cy="150" r="5" fill="#FFFFFF"/>
          <circle cx="280" cy="150" r="5" fill="#FFFFFF"/>
          <!-- Maxwell Relation -->
          <rect x="40" y="240" width="160" height="40" rx="8" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899"/>
          <text x="120" y="265" fill="#FFFFFF" font-family="monospace" font-size="14" text-anchor="middle">c = 1 / √(μ₀ε₀)</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>