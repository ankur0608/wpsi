<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Data Structures: Stacks,</tspan>
    <tspan x="70" y="302">Queues, and Trees</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- Data Structures Visual -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="210" y="50" fill="#93C5FD" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Core Data Structures</text>
    <!-- Stack (LIFO) -->
    <g transform="translate(40, 70)">
      <rect x="0" y="0" width="90" height="130" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="10" y="80" width="70" height="22" rx="4" fill="#3B82F6"/>
      <text x="45" y="95" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">Node 1</text>
      <rect x="10" y="50" width="70" height="22" rx="4" fill="#60A5FA"/>
      <text x="45" y="65" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">Node 2</text>
      <rect x="10" y="20" width="70" height="22" rx="4" fill="#93C5FD"/>
      <text x="45" y="35" fill="#0F172A" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Top</text>
      <text x="45" y="120" fill="#93C5FD" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Stack (LIFO)</text>
    </g>
    <!-- Queue (FIFO) -->
    <g transform="translate(145, 70)">
      <rect x="0" y="0" width="115" height="130" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect x="12" y="20" width="90" height="22" rx="4" fill="#10B981"/>
      <text x="57" y="35" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle">Rear (EnQ)</text>
      <rect x="12" y="48" width="90" height="22" rx="4" fill="#34D399"/>
      <text x="57" y="63" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Data Element</text>
      <rect x="12" y="76" width="90" height="22" rx="4" fill="#6EE7B7"/>
      <text x="57" y="91" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Front (DeQ)</text>
      <text x="57" y="120" fill="#6EE7B7" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Queue (FIFO)</text>
    </g>
    <!-- Binary Tree -->
    <g transform="translate(275, 70)">
      <rect x="0" y="0" width="110" height="130" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <!-- Root -->
      <circle cx="55" cy="28" r="14" fill="#F59E0B"/>
      <text x="55" y="32" fill="#0F172A" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">50</text>
      <line x1="45" y1="40" x2="28" y2="60" stroke="#FCD34D" stroke-width="2"/>
      <line x1="65" y1="40" x2="82" y2="60" stroke="#FCD34D" stroke-width="2"/>
      <!-- Left Child -->
      <circle cx="28" cy="72" r="12" fill="#FCD34D"/>
      <text x="28" y="76" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">30</text>
      <!-- Right Child -->
      <circle cx="82" cy="72" r="12" fill="#FCD34D"/>
      <text x="82" y="76" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">70</text>
      <text x="55" y="120" fill="#FCD34D" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Binary Tree</text>
    </g>
    <!-- Bottom Badge -->
    <rect x="40" y="215" width="345" height="35" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="212" y="236" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Time Complexity: O(1) Push/Pop • O(log n) BST Search</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>