<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="325" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Software Engineering: SDLC</tspan><tspan x="70" y="298">Models</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- Code IDE Window -->
          <rect x="20" y="30" width="340" height="230" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
          <rect x="20" y="30" width="340" height="35" rx="14" fill="#1E293B"/>
          <circle cx="45" cy="48" r="5" fill="#EF4444"/>
          <circle cx="65" cy="48" r="5" fill="#F59E0B"/>
          <circle cx="85" cy="48" r="5" fill="#10B981"/>
          <text x="190" y="52" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">solution.c - WPSI Technical</text>
          <!-- Code content -->
          <g fill="#93C5FD" font-family="monospace" font-size="13">
            <text x="40" y="95"><tspan fill="#F472B6">#include</tspan> &lt;stdio.h&gt;</text>
            <text x="40" y="125"><tspan fill="#38BDF8">int</tspan> main() {</text>
            <text x="60" y="150"><tspan fill="#38BDF8">int</tspan> *ptr = &amp;score;</text>
            <text x="60" y="175">printf(<tspan fill="#FDE047">"Rank: #1
"</tspan>);</text>
            <text x="60" y="200"><tspan fill="#F472B6">return</tspan> 0;</text>
            <text x="40" y="225">}</text>
          </g>
          <rect x="180" y="110" width="160" height="90" rx="10" fill="#3B82F6" fill-opacity="0.3" stroke="#60A5FA"/>
          <text x="260" y="150" fill="#FFFFFF" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Pointers & Memory</text>
          <text x="260" y="175" fill="#93C5FD" font-family="monospace" font-size="12" text-anchor="middle">0x7FFE24B0</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>