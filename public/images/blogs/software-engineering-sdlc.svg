<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#3B82F6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#60A5FA" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#93C5FD"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="200" height="38" rx="19" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="24" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">COMPUTER SCIENCE</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Software Engineering: SDLC</tspan>
    <tspan x="70" y="302">Models &amp; Methodologies</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#93C5FD"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  <g transform="translate(720, 130)">
    <!-- SDLC Cycle Workflow -->
    <rect x="20" y="20" width="380" height="270" rx="16" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="210" y="55" fill="#93C5FD" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">SDLC Development Lifecycle</text>
    <!-- Stage Pills -->
    <g transform="translate(40, 75)">
      <!-- 1. Requirements -->
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#1E293B" stroke="#60A5FA"/>
      <circle cx="20" cy="21" r="10" fill="#3B82F6"/>
      <text x="20" y="25" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">1</text>
      <text x="90" y="26" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Requirements</text>
      <!-- Arrow to 2 -->
      <path d="M 165 21 L 180 21" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
      <!-- 2. Architecture & Design -->
      <rect x="185" y="0" width="155" height="42" rx="8" fill="#1E293B" stroke="#60A5FA"/>
      <circle cx="205" cy="21" r="10" fill="#3B82F6"/>
      <text x="205" y="25" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">2</text>
      <text x="270" y="26" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">System Design</text>
      <!-- 3. Coding -->
      <rect x="0" y="60" width="160" height="42" rx="8" fill="#1E293B" stroke="#10B981"/>
      <circle cx="20" cy="81" r="10" fill="#10B981"/>
      <text x="20" y="85" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">3</text>
      <text x="90" y="86" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Implementation</text>
      <!-- 4. Testing -->
      <rect x="185" y="60" width="155" height="42" rx="8" fill="#1E293B" stroke="#F59E0B"/>
      <circle cx="205" cy="81" r="10" fill="#F59E0B"/>
      <text x="205" y="85" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">4</text>
      <text x="270" y="86" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">QA &amp; Testing</text>
      <!-- 5. Deployment -->
      <rect x="0" y="120" width="160" height="42" rx="8" fill="#1E293B" stroke="#8B5CF6"/>
      <circle cx="20" cy="141" r="10" fill="#8B5CF6"/>
      <text x="20" y="145" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">5</text>
      <text x="90" y="146" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Deployment</text>
      <!-- 6. Maintenance -->
      <rect x="185" y="120" width="155" height="42" rx="8" fill="#1E293B" stroke="#EC4899"/>
      <circle cx="205" cy="141" r="10" fill="#EC4899"/>
      <text x="205" y="145" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">6</text>
      <text x="270" y="146" fill="#E2E8F0" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Maintenance</text>
    </g>
    <!-- Badge -->
    <rect x="50" y="245" width="320" height="28" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA"/>
    <text x="210" y="264" fill="#93C5FD" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Waterfall • Agile • Spiral • V-Model</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>