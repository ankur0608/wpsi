<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B24"/>
      <stop offset="100%" stop-color="#2A174E"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glowing background orb -->
  <circle cx="950" cy="270" r="220" fill="#8B5CF6" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="200" cy="100" r="140" fill="#C084FC" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- Top Brand Ribbon -->
  <g transform="translate(70, 70)">
    <!-- MCQ Prep Zone Brand pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="20" cy="19" r="6" fill="#E879F9"/>
    <text x="36" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">MCQ PREP ZONE</text>

    <!-- Category Pill -->
    <rect x="235" y="0" width="180" height="38" rx="19" fill="#8B5CF6" fill-opacity="0.25" stroke="#C084FC" stroke-width="1.5"/>
    <text x="325" y="24" fill="#E879F9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5" text-anchor="middle">ELECTRONICS</text>
  </g>

  <!-- Left Content: Title -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    <tspan x="70" y="250">Transistors: BJT vs. FET</tspan><tspan x="70" y="298">Fundamentals</tspan>
  </text>

  <!-- Target Exam Badge / Read Time -->
  <g transform="translate(70, 480)">
    <rect x="0" y="0" width="460" height="54" rx="14" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <path d="M 22,27 L 30,17 L 38,27 Z" fill="#E879F9"/>
    <text x="46" y="32" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Gujarat Police WPSI &amp; GPSC Technical Exam Prep</text>
  </g>

  <!-- Right Visual Component -->
  
        <g transform="translate(740, 150)">
          <!-- P-N Junction & Transistor -->
          <rect x="30" y="40" width="150" height="200" rx="10" fill="#3B82F6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
          <text x="105" y="80" fill="#93C5FD" font-family="system-ui" font-size="28" font-weight="bold" text-anchor="middle">P-Type</text>
          <text x="105" y="120" fill="#FFFFFF" font-family="system-ui" font-size="13" text-anchor="middle">Majority: Holes (+)</text>
          <circle cx="80" cy="160" r="12" fill="#C084FC" fill-opacity="0.4"/>
          <text x="80" y="165" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">+</text>
          <circle cx="130" cy="180" r="12" fill="#C084FC" fill-opacity="0.4"/>
          <text x="130" y="185" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">+</text>

          <rect x="180" y="40" width="150" height="200" rx="10" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
          <text x="255" y="80" fill="#6EE7B7" font-family="system-ui" font-size="28" font-weight="bold" text-anchor="middle">N-Type</text>
          <text x="255" y="120" fill="#FFFFFF" font-family="system-ui" font-size="13" text-anchor="middle">Majority: Electrons (-)</text>
          <circle cx="230" cy="160" r="12" fill="#10B981" fill-opacity="0.4"/>
          <text x="230" y="165" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">-</text>
          <circle cx="280" cy="180" r="12" fill="#10B981" fill-opacity="0.4"/>
          <text x="280" y="185" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">-</text>

          <!-- Depletion Layer -->
          <rect x="165" y="35" width="30" height="210" fill="#E879F9" fill-opacity="0.3" stroke="#E879F9" stroke-width="1.5" stroke-dasharray="4,2"/>
          <text x="180" y="265" fill="#E879F9" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Depletion Barrier</text>
        </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#primaryGrad)"/>
</svg>